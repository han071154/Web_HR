server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: route điều hướng phía client dùng hash (/#/...), nhưng vẫn fallback về index.html
    # cho chắc nếu có deep link trực tiếp vào một đường dẫn tĩnh không tồn tại.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy sang service backend trong cùng mạng docker-compose — tránh phải cấu hình
    # CORS/VITE_API_URL theo từng domain khi triển khai (xem frontend/Dockerfile).
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://backend:4000/uploads/;
        proxy_set_header Host $host;
    }
}
