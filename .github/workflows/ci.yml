name: CI

on:
  push:
    branches: [main, master, Dev, feature]
  pull_request:
  # Chạy tay từ tab Actions để deploy lại staging (vd sau khi đổi secret).
  workflow_dispatch:

# Không cho 2 lần deploy staging chạy chồng lên nhau.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build frontend
        run: npm run build

      # docs/openapi.json phải khớp spec trong backend/src/openapi (chạy `npm run docs:openapi --workspace backend`).
      - name: OpenAPI export is up to date
        run: |
          npm run docs:openapi --workspace backend
          git diff --exit-code docs/openapi.json

  # Build (không push) các Docker image để xác nhận Dockerfile build được trước khi deploy.
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: web-hr-backend:ci

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          tags: web-hr-frontend:ci

  # Chạy API thật với PostgreSQL: smoke test + bộ Postman (tests/postman).
  api-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: web_hr
          POSTGRES_USER: web_hr
          POSTGRES_PASSWORD: web_hr_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U web_hr -d web_hr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://web_hr:web_hr_password@localhost:5432/web_hr
      JWT_SECRET: ci_test_secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create schema, seed data and test users
        run: |
          npm run db:setup
          npm run db:test-users

      - name: Start backend
        run: |
          npm run start --workspace backend > backend.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -fs http://localhost:4000/api/health && exit 0
            sleep 1
          done
          echo "Backend did not start"
          cat backend.log
          exit 1

      - name: API smoke test
        run: npm run test:smoke

      - name: Postman collection (Newman)
        run: >-
          npx --yes newman@6 run tests/postman/WebHR.postman_collection.json
          -e tests/postman/WebHR-local.postman_environment.json
          --reporter-cli-no-console

      - name: Show backend log
        if: failure()
        run: cat backend.log

  # Deploy tự động lên staging khi push vào nhánh Dev (hoặc chạy tay) sau khi build, test và Docker image đều
  # qua. Máy chủ staging tự build image từ mã nguồn và chạy scripts/deploy.sh (sao lưu CSDL → build → db:setup →
  # health check → tự rollback nếu lỗi). Cần cấu hình trong Settings → Secrets and variables → Actions:
  #   STAGING_HOST, STAGING_USER, STAGING_SSH_KEY (private key), STAGING_PATH (thư mục repo trên máy chủ)
  # Chưa có secret thì job chỉ ghi chú và bỏ qua, không làm đỏ pipeline. Xem docs/DEPLOYMENT.md mục 9.
  deploy-staging:
    needs: [build, docker-build, api-tests]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/Dev')
    runs-on: ubuntu-latest
    environment:
      name: staging

    steps:
      - name: Check staging secrets
        id: secrets
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
        run: |
          if [ -z "$STAGING_HOST" ]; then
            echo "::notice::Chưa cấu hình secret STAGING_HOST, bỏ qua deploy staging."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        if: steps.secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd "${{ secrets.STAGING_PATH }}"
            git fetch --all --tags --prune
            ./scripts/deploy.sh .env.staging ${{ github.sha }}
