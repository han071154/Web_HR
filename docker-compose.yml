services:
  db:
    image: postgres:16-alpine
    container_name: web_hr_db
    environment:
      POSTGRES_DB: web_hr
      POSTGRES_USER: web_hr
      POSTGRES_PASSWORD: web_hr_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U web_hr -d web_hr"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
